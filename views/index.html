<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Tienda de Videojuegos</title>
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <header>
    <h1>🎮 Tienda de Videojuegos</h1>
  </header>

  <main>
    <section id="seccion-lista">
      <h2>Videojuegos disponibles</h2>
      <!-- Esta lista ya no esta escrita a mano: la llena app.js con datos reales -->
      <ul id="lista-videojuegos"></ul>
    </section>

    <section id="seccion-agregar">
      <h2>Agregar videojuego</h2>
      <form id="form-agregar">
        <label>Nombre: <input type="text" id="input-nombre" required></label>
        <label>Precio: <input type="number" id="input-precio" required></label>
        <label>Categoria: <input type="text" id="input-categoria" required></label>
        <button type="submit">Agregar</button>
      </form>
      <p id="mensaje-agregar"></p>
    </section>
  </main>

  <script src="/js/app.js"></script>
</body>
</html>
